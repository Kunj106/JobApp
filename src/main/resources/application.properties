server.port=${PORT:8080}

spring.application.name=JobApp

# =========================
# DATABASE
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# AI - OpenRouter
# =========================
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:mistralai/mistral-7b-instruct:free}

# =========================
# LOGGING
# =========================
logging.level.com.jobportal=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# =========================
# COURSE & JOB SYNC
# =========================
course.sync.enabled=${COURSE_SYNC_ENABLED:true}
job.sync.enabled=${JOB_SYNC_ENABLED:true}

# =========================
# ADZUNA
# =========================
adzuna.app.id=${ADZUNA_APP_ID}
adzuna.app.key=${ADZUNA_APP_KEY}

# =========================
# EMAIL
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.digest.to=${EMAIL_DIGEST_TO}
email.digest.from=${EMAIL_DIGEST_FROM}
email.digest.location=${EMAIL_DIGEST_LOCATION:mumbai}
email.digest.enabled=${EMAIL_DIGEST_ENABLED:true}
email.digest.cron=${EMAIL_DIGEST_CRON:0 0 6 * * *}
